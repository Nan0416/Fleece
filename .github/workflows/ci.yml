name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to a branch makes the first run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: build, lint, test
    runs-on: ubuntu-latest

    # The integration suites need a real PostgreSQL. Without one they skip themselves
    # and the run is green having tested none of the locking, idempotency or client
    # round-trip behaviour — which is the failure this whole job exists to notice.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Every integration suite takes its own schema in this one database, so they run
      # in parallel workers without truncating each other's rows.
      FLEECE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # First, and not only because it is fast to fail. `npm test` is not evidence that
      # the code compiles: ts-jest keys its cache on a file's own content, so a change
      # to a shared package leaves every importer cached and suites go green against
      # types that no longer exist. The build is the authority.
      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:lint

      - name: Test
        run: npm run test:ci

      # Jest reports a skipped suite as `success: true`. This is what turns "the
      # database was not reachable" from a green run into a red one.
      - name: Every suite ran something
        if: always()
        run: node scripts/assert-suites-ran.js jest-results.json

      # Separate from `Test`, and after it: an instrumented run is slower, and a failure
      # here is a different thing from a failing test — the suite passed, it just covers
      # less than it did.
      #
      # It needs nothing from the `services:` block above. `jest.coverage.config.js`
      # runs the unit suites alone, so this step gives the same number on a laptop, on
      # this runner, and on whatever CI replaces it — the thresholds hold or fail on the
      # change rather than on what the environment happened to provide.
      - name: Coverage thresholds
        run: npm run test:coverage

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore
